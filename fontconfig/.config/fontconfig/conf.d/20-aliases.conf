<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ── SANS-SERIF ─────────────────────────────────────────────────── -->
  <!-- RecMonoCasual Nerd Font Propo: proportional spacing, correct for  -->
  <!-- prose/UI rendering. Base NF has spacing=100 (monospaced) which    -->
  <!-- looks wrong in paragraph text.                                    -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>RecMonoCasual Nerd Font Propo</family>
      <family>Sarasa UI SC</family>
      <family>Sarasa UI TC</family>
      <family>Sarasa UI J</family>
      <family>Sarasa UI K</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── SERIF ──────────────────────────────────────────────────────── -->
  <!-- Source Serif 4 for Latin. Sarasa Gothic behind it for any CJK    -->
  <!-- that appears in serif context — not ideal but won't show boxes.  -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Serif 4</family>
      <family>Sarasa Gothic SC</family>
      <family>Sarasa Gothic TC</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- ── MONOSPACE ──────────────────────────────────────────────────── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF</family>
      <family>FantasqueSansM Nerd Font</family>
      <family>Sarasa Mono SC</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- ── SYSTEM-UI ──────────────────────────────────────────────────── -->
  <!-- Hyprland, GTK4, quickshell, rofi all consume this.               -->
  <!-- Propo is correct here — UI text is proportional.                 -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>RecMonoCasual Nerd Font Propo</family>
      <family>Sarasa UI SC</family>
      <family>Sarasa UI J</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── UI-SANS-SERIF ──────────────────────────────────────────────── -->
  <!-- CSS generic used by web content on modern sites.                 -->
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>RecMonoCasual Nerd Font Propo</family>
      <family>Sarasa UI SC</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── UI-MONOSPACE ───────────────────────────────────────────────── -->
  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Maple Mono NF</family>
      <family>Sarasa Mono SC</family>
    </prefer>
  </alias>

  <!-- ── CURSIVE / FANTASY ──────────────────────────────────────────── -->
  <!-- Rarely hit. Propo is better than monospaced NF for flowing text. -->
  <alias>
    <family>cursive</family>
    <prefer>
      <family>RecMonoCasual Nerd Font Propo</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>fantasy</family>
    <prefer>
      <family>RecMonoCasual Nerd Font Propo</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

</fontconfig>
