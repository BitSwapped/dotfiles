<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ── 1. EMOJI GENERIC FAMILY ───────────────────────────────────── -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- ── 2. STRIP EMOJI RANGES FROM TEXT FONTS ─────────────────────── -->
  <!-- Fonts like DejaVu Sans and Font Awesome have placeholder glyphs  -->
  <!-- in emoji ranges, which prevents fallthrough to Noto Color Emoji. -->
  <!-- Ranges removed:                                                   -->
  <!--   U+1F600–1F64F  Emoticons                                       -->
  <!--   U+1F300–1F5FF  Misc Symbols and Pictographs                    -->
  <!--   U+1F680–1F6FF  Transport and Map                               -->
  <!--   U+1F900–1F9FF  Supplemental Symbols and Pictographs            -->
  <!--   U+1FA00–1FAFF  Symbols and Pictographs Extended-A              -->
  <!--   U+2700–27BF    Dingbats                                        -->
  <!--   U+2600–26FF    Misc Symbols                                    -->

  <match target="scan">
    <test name="family" compare="contains"><string>DejaVu</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x1F600</int><int>0x1F64F</int></range>
          <range><int>0x1F300</int><int>0x1F5FF</int></range>
          <range><int>0x1F680</int><int>0x1F6FF</int></range>
          <range><int>0x1F900</int><int>0x1F9FF</int></range>
          <range><int>0x1FA00</int><int>0x1FAFF</int></range>
          <range><int>0x2700</int><int>0x27BF</int></range>
          <range><int>0x2600</int><int>0x26FF</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <match target="scan">
    <test name="family" compare="contains"><string>Font Awesome</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x1F600</int><int>0x1F64F</int></range>
          <range><int>0x1F300</int><int>0x1F5FF</int></range>
          <range><int>0x1F680</int><int>0x1F6FF</int></range>
          <range><int>0x1F900</int><int>0x1F9FF</int></range>
          <range><int>0x1FA00</int><int>0x1FAFF</int></range>
          <range><int>0x2700</int><int>0x27BF</int></range>
          <range><int>0x2600</int><int>0x26FF</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <!-- ── 3. STRIP ASCII FROM EMOJI FONTS ───────────────────────────── -->
  <!-- Prevents Noto Color Emoji from stealing Basic Latin,            -->
  <!-- Latin-1 Supplement, and common punctuation ranges from your     -->
  <!-- text fonts. Without this, characters like © ® → get rendered   -->
  <!-- from the emoji font instead of your text font.                  -->

  <match target="font">
    <test name="family" compare="contains"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0020</int><int>0x007E</int></range>
          <range><int>0x00A0</int><int>0x00FF</int></range>
          <range><int>0x2000</int><int>0x206F</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <match target="font">
    <test name="family" compare="contains"><string>Noto Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0020</int><int>0x007E</int></range>
          <range><int>0x00A0</int><int>0x00FF</int></range>
          <range><int>0x2000</int><int>0x206F</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <!-- ── 4. EMOJI FALLBACK INTO GENERIC FAMILIES ───────────────────── -->
  <!-- append_last places emoji after everything the alias chain        -->
  <!-- resolved, so it only activates for codepoints nothing else       -->
  <!-- covers.                                                          -->

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append_last"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append_last"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="append_last"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="append_last"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="append_last"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- ── 5. REDIRECT PLATFORM-SPECIFIC EMOJI NAMES ─────────────────── -->

  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="assign"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq"><string>Apple Color Emoji</string></test>
    <edit name="family" mode="assign"><string>Noto Color Emoji</string></edit>
  </match>

</fontconfig>
