<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Redirect common CJK family names web content requests -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic J</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic K</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Source Han Sans</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Noto Serif CJK</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic SC</string></edit>
  </match>

  <!-- Windows CJK names used by web content -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>SimSun</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>SimHei</string></test>
    <edit name="family" mode="prepend"><string>Sarasa Gothic SC</string></edit>
  </match>

  <!-- Language tag safety net — only when lang is explicitly set -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <edit name="family" mode="prepend">
      <string>Sarasa UI SC</string>
      <string>Sarasa Gothic SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ja</string></test>
    <edit name="family" mode="prepend">
      <string>Sarasa UI J</string>
      <string>Sarasa Gothic J</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>ko</string></test>
    <edit name="family" mode="prepend">
      <string>Sarasa UI K</string>
      <string>Sarasa Gothic K</string>
    </edit>
  </match>

</fontconfig>
