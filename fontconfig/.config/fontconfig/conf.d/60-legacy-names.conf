<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Legacy monospace names → Maple Mono NF -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Courier New</string></test>
    <edit name="family" mode="prepend"><string>Maple Mono NF</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Courier</string></test>
    <edit name="family" mode="prepend"><string>Maple Mono NF</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Lucida Console</string></test>
    <edit name="family" mode="prepend"><string>Maple Mono NF</string></edit>
  </match>

  <!-- Legacy sans names → RecMonoCasual Propo for UI correctness -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="prepend">
      <string>RecMonoCasual Nerd Font Propo</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica</string></test>
    <edit name="family" mode="prepend"><string>RecMonoCasual Nerd Font Propo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend"><string>RecMonoCasual Nerd Font Propo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend">
      <string>RecMonoCasual Nerd Font Propo</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>-apple-system</string></test>
    <edit name="family" mode="prepend"><string>RecMonoCasual Nerd Font Propo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend"><string>RecMonoCasual Nerd Font Propo</string></edit>
  </match>

</fontconfig>
